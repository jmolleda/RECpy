# RECpy - default configuration
#
# Reproduces the configuration used for the results published in
#   Machine Learning with Applications 26, 101016 (2026)
#   https://doi.org/10.1016/j.mlwa.2026.101016
#
# Override with:  RECPY_CONFIG=config/quick.toml python code/run_pipeline.py
# Redirect output: RECPY_OUTPUT_DIR=/results python code/run_pipeline.py

name = "default"
description = "Full published configuration: 24 models, 4 seasonal folds, 6 supply points."

# Calendar year of the dataset. Fold boundaries below are month-day only and are
# combined with this value, so a different year of data needs only this change.
year = 2025

[paths]
# Relative to the repository root; absolute paths are also accepted.
data = "data"
# Root for generated outputs. Code Ocean capsules set RECPY_OUTPUT_DIR=/results,
# because files written under code/ are discarded at the end of a Reproducible Run.
output = "code"

[data]
# Every consumption column present in the multivariate dataset, including
# supply points this configuration does not analyse. The deep-learning models
# are univariate in consumption, so all but the target must be removed before
# scaling; listing them here keeps that correct for a configuration that
# analyses only some of the supply points.
consumption_columns = ["C_SP1", "C_SP2", "C_SP3", "C_SP4", "C_SP5", "C_SP6"]

[data_files]
prices = "prices_cv_folds.csv"
solar = "solar_generation.csv"
meteo_calendar = "consumption_meteo_calendar.csv"

[models]
# Model families to run: machine learning, statistical (ARIMA/SARIMAX) and
# deep learning. Dropping one skips its stage in code/run_pipeline.py.
families = ["ml", "arima", "dl"]
# Subset of ML regressors to run; omit or leave empty to run all 15.
ml_subset = []
# Limit each fold's test window to the first N days; 0 means the whole month.
max_test_days = 0

[[folds]]
name = "fold1_apr"
label = "Fold 1 – Apr"
train_end = "03-31"
test_start = "04-01"
test_end = "04-30"

[[folds]]
name = "fold2_jul"
label = "Fold 2 – Jul"
train_end = "06-30"
test_start = "07-01"
test_end = "07-31"

[[folds]]
name = "fold3_oct"
label = "Fold 3 – Oct"
train_end = "09-30"
test_start = "10-01"
test_end = "10-31"

[[folds]]
name = "fold4_dec"
label = "Fold 4 – Dec"
train_end = "11-30"
test_start = "12-01"
test_end = "12-31"

[[supply_points]]
id = "SP1"
history_csv = "consumption_SP1.csv"
column = "C_SP1"
deployed_model = "Support Vector"

[[supply_points]]
id = "SP2"
history_csv = "consumption_SP2.csv"
column = "C_SP2"
deployed_model = "k-Nearest Neighbors"

[[supply_points]]
id = "SP3"
history_csv = "consumption_SP3.csv"
column = "C_SP3"
deployed_model = "Huber"

[[supply_points]]
id = "SP4"
history_csv = "consumption_SP4.csv"
column = "C_SP4"
deployed_model = "Huber"

[[supply_points]]
id = "SP5"
history_csv = "consumption_SP5.csv"
column = "C_SP5"
deployed_model = "Huber"

[[supply_points]]
id = "SP6"
history_csv = "consumption_SP6.csv"
column = "C_SP6"
deployed_model = "Extra Trees"

# Per-supply-point ARIMA and SARIMAX orders, and the exogenous variables
# selected for SARIMAX, as reported in the companion article.
[arima.SP1]
order = [7, 0, 2]
sarimax_order = [1, 0, 1]
sarimax_seasonal = [1, 0, 1, 24]
sarimax_exog = ["Hour", "diffuse_radiation_instant (W/m²)"]

[arima.SP2]
order = [5, 0, 3]
sarimax_order = [1, 1, 1]
sarimax_seasonal = [1, 0, 1, 24]
sarimax_exog = ["temperature_2m (°C)"]

[arima.SP3]
order = [2, 0, 3]
sarimax_order = [0, 0, 1]
sarimax_seasonal = [1, 0, 1, 24]
sarimax_exog = ["diffuse_radiation_instant (W/m²)"]

[arima.SP4]
order = [3, 0, 3]
sarimax_order = [1, 1, 1]
sarimax_seasonal = [0, 0, 1, 24]
sarimax_exog = ["Hour"]

[arima.SP5]
order = [1, 1, 3]
sarimax_order = [1, 0, 1]
sarimax_seasonal = [1, 0, 1, 24]
sarimax_exog = ["Hour"]

[arima.SP6]
order = [3, 0, 2]
sarimax_order = [1, 0, 1]
sarimax_seasonal = [1, 1, 1, 24]
sarimax_exog = ["DoW", "Holidays", "diffuse_radiation_instant (W/m²)"]

# Per-supply-point deep-learning architectures from the search reported in
# the companion article (Appendix B).
[dl.SP1]
lstm = { n_input = 72, nodes = 30, epochs = 50, batch = 32, dropout = 0.0 }
gru  = { n_input = 192, nodes = 25, epochs = 20, batch = 32, dropout = 0.0 }
tcn  = { n_input = 144, filters = 18, dilations = [1, 2, 4], epochs = 20, batch = 32, dropout = 0.0 }

[dl.SP2]
lstm = { n_input = 72, nodes = 18, epochs = 20, batch = 64, dropout = 0.0 }
gru  = { n_input = 72, nodes = 25, epochs = 50, batch = 32, dropout = 0.2 }
tcn  = { n_input = 72, filters = 25, dilations = [1, 2, 4], epochs = 50, batch = 32, dropout = 0.0 }

[dl.SP3]
lstm = { n_input = 144, nodes = 25, epochs = 50, batch = 64, dropout = 0.0 }
gru  = { n_input = 72, nodes = 25, epochs = 50, batch = 32, dropout = 0.0 }
tcn  = { n_input = 72, filters = 25, dilations = [1, 2, 4], epochs = 50, batch = 32, dropout = 0.0 }

[dl.SP4]
lstm = { n_input = 72, nodes = 30, epochs = 50, batch = 32, dropout = 0.0 }
gru  = { n_input = 144, nodes = 25, epochs = 50, batch = 64, dropout = 0.0 }
tcn  = { n_input = 192, filters = 30, dilations = [1, 2, 4, 8], epochs = 50, batch = 64, dropout = 0.2 }

[dl.SP5]
lstm = { n_input = 72, nodes = 25, epochs = 50, batch = 32, dropout = 0.2 }
gru  = { n_input = 144, nodes = 25, epochs = 50, batch = 32, dropout = 0.0 }
tcn  = { n_input = 72, filters = 18, dilations = [1, 2, 4], epochs = 20, batch = 32, dropout = 0.0 }

[dl.SP6]
lstm = { n_input = 72, nodes = 25, epochs = 20, batch = 32, dropout = 0.0 }
gru  = { n_input = 72, nodes = 18, epochs = 20, batch = 32, dropout = 0.0 }
tcn  = { n_input = 144, filters = 25, dilations = [1, 2, 4, 8], epochs = 50, batch = 32, dropout = 0.0 }

[battery]
capacity_kwh = 50.16
min_soc_kwh = 5.0
efficiency = 0.96
power_limit_kw = 12.0
degradation_eur_per_kwh = 0.033
initial_soc_fraction = 0.50

[grid]
export_limit_kw = 32.0

[forecasting]
# First day of the training history (month-day, combined with "year").
train_start = "01-02"
lookback_hours = 192
horizon_hours = 24
random_seed = 123

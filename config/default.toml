# RECpy - default configuration
#
# Reproduces the configuration used for the results published in
#   Machine Learning with Applications 26, 101016 (2026)
#   https://doi.org/10.1016/j.mlwa.2026.101016
#
# Override with:  RECPY_CONFIG=config/quick.toml python code/generate_ml_cv.py
# Redirect output: RECPY_OUTPUT_DIR=/results python code/generate_ml_cv.py

name = "default"
description = "Full published configuration: 24 models, 4 seasonal folds, 6 supply points."

# Calendar year of the dataset. Fold boundaries below are month-day only and are
# combined with this value, so a different year of data needs only this change.
year = 2025

[paths]
# Relative to the repository root; absolute paths are also accepted.
data = "data"
# Root for generated outputs. Code Ocean capsules set RECPY_OUTPUT_DIR=/results,
# because files written under code/ are discarded at the end of a Reproducible Run.
output = "code"

[data_files]
prices = "prices_cv_folds.csv"
solar = "solar_generation.csv"
meteo_calendar = "consumption_meteo_calendar.csv"

[models]
# Model families to run. The quick configuration drops "dl".
families = ["ml", "arima", "dl"]

[[folds]]
name = "fold1_apr"
label = "Fold 1 – Apr"
train_end = "03-31"
test_start = "04-01"
test_end = "04-30"

[[folds]]
name = "fold2_jul"
label = "Fold 2 – Jul"
train_end = "06-30"
test_start = "07-01"
test_end = "07-31"

[[folds]]
name = "fold3_oct"
label = "Fold 3 – Oct"
train_end = "09-30"
test_start = "10-01"
test_end = "10-31"

[[folds]]
name = "fold4_dec"
label = "Fold 4 – Dec"
train_end = "11-30"
test_start = "12-01"
test_end = "12-31"

[[supply_points]]
id = "SP1"
history_csv = "consumption_SP1.csv"
column = "C_SP1"
deployed_model = "Support Vector"

[[supply_points]]
id = "SP2"
history_csv = "consumption_SP2.csv"
column = "C_SP2"
deployed_model = "k-Nearest Neighbors"

[[supply_points]]
id = "SP3"
history_csv = "consumption_SP3.csv"
column = "C_SP3"
deployed_model = "Huber"

[[supply_points]]
id = "SP4"
history_csv = "consumption_SP4.csv"
column = "C_SP4"
deployed_model = "Huber"

[[supply_points]]
id = "SP5"
history_csv = "consumption_SP5.csv"
column = "C_SP5"
deployed_model = "Huber"

[[supply_points]]
id = "SP6"
history_csv = "consumption_SP6.csv"
column = "C_SP6"
deployed_model = "Extra Trees"

[battery]
capacity_kwh = 50.16
min_soc_kwh = 5.0
efficiency = 0.96
power_limit_kw = 12.0
degradation_eur_per_kwh = 0.033
initial_soc_fraction = 0.50

[grid]
export_limit_kw = 32.0

[forecasting]
lookback_hours = 192
horizon_hours = 24
random_seed = 123

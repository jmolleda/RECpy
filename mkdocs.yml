site_name: RECpy
site_description: >-
  Particularized demand forecasting and day-ahead battery scheduling for energy
  communities.
site_url: https://jmolleda.github.io/RECpy/
repo_url: https://github.com/jmolleda/RECpy
repo_name: jmolleda/RECpy
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; 2026 J. Molleda, F. Cosío &middot; MIT License

theme:
  name: material
  logo: assets/icon-badge.png
  favicon: assets/icon.png
  palette:
    # The interface's own accent, so the documentation and the tool match.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light theme
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/recpy.css

markdown_extensions:
  - admonition
  - attr_list
  # Needed for Markdown inside raw HTML blocks, which the card grids use.
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Your own community: your-own-community.md
  - Configuration reference: configuration.md
  - What the pipeline does: pipeline.md
  - Reading the results: results.md
  - Reproducibility: reproducibility.md
  - Development: development.md
  - Changelog: changelog.md

# The helper that regenerates the changelog page lives here, but is not content.
exclude_docs: |
  build_changelog.py
